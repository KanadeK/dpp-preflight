name: Bug report
description: Report reproducible incorrect behavior with sanitized data
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Do not attach confidential product or supplier evidence.
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: v0.1.0
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Command and exit code
      render: shell
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: fixture
    attributes:
      label: Minimal sanitized fixture or reproduction
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Node version and operating system
    validations:
      required: true
